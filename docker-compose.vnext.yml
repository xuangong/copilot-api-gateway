services:
  gateway-vnext:
    build:
      context: ./vnext
      dockerfile: apps/platform-bun/Dockerfile
      secrets:
        - npmrc
    container_name: copilot-gateway-vnext
    ports:
      # 41414 on both sides, and on both the local and the SSH host, so one URL
      # and one set of smoke-test commands work everywhere.
      - "${VNEXT_PORT:-41414}:41414"
    environment:
      - PORT=41414
      - ACCOUNT_TYPE=${ACCOUNT_TYPE:-individual}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1
      # Dev-only: bypasses dashboard OAuth so smoke tests can hit /v1/* directly.
      # Set ONE of these in .env (or shell) — leave both unset for prod-like runs.
      - VNEXT_DEV_GITHUB_TOKEN=${VNEXT_DEV_GITHUB_TOKEN:-}
      - VNEXT_DEV_COPILOT_TOKEN=${VNEXT_DEV_COPILOT_TOKEN:-}
      - VNEXT_DEV_USER_ID=${VNEXT_DEV_USER_ID:-dev-user}
    volumes:
      # Persist vnext sqlite separately from the prod gateway's .data dir.
      - ./data-vnext:/data
    restart: unless-stopped

secrets:
  # Only needed on machines whose npm default registry is a corporate proxy;
  # the build otherwise resolves everything from the public registry. Pointing
  # at $HOME/.npmrc unconditionally made the build fail outright on any host
  # without one, which is every host but a dev laptop. Set NPMRC_FILE in .env
  # to opt in.
  npmrc:
    file: ${NPMRC_FILE:-/dev/null}
